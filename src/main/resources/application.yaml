spring:
  application:
    name: secu-qna
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:secu_qna}
    username: ${DB_USER:secu_qna}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  thymeleaf:
    cache: true
server:
  servlet:
    session:
      timeout: 10m
  error:
    include-message: never
    include-stacktrace: never
logging:
  level:
    org.hibernate.orm.connections.pooling: ERROR
