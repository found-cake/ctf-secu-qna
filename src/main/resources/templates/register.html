<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create account · Secu Q&amp;A</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
  </head>
  <body>
    <header>
      <div class="bar">
        <a class="brand" th:href="@{/login}">Secu Q&amp;A</a>
      </div>
    </header>

    <main>
      <section class="panel form-panel">
        <h1>Create account</h1>
        <p class="lead">A place to keep your support requests.</p>
        <p class="alert" role="alert" th:if="${error}" th:text="${error}"></p>

        <form th:action="@{/register}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <div class="field">
            <label for="username">Username</label>
            <input id="username" name="username" minlength="4" maxlength="20"
                   pattern="[A-Za-z0-9]{4,20}" autocomplete="username" required th:value="${username}">
            <small class="meta">4–20 English letters or digits.</small>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" minlength="8"
                   autocomplete="new-password" required>
            <small class="meta">At least 8 characters, up to 72 UTF-8 bytes.</small>
          </div>
          <button class="button" type="submit">Create account</button>
        </form>

        <p class="form-footer">Already registered? <a th:href="@{/login}">Sign in</a></p>
      </section>
    </main>
    <footer th:replace="~{fragments/footer :: notice}"></footer>
  </body>
</html>
