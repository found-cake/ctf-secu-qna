<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My tickets · Secu Q&amp;A</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
  </head>
  <body>
    <header>
      <div class="bar">
        <a class="brand" th:href="@{/tickets}">Secu Q&amp;A</a>
        <nav class="nav" aria-label="Main">
          <a th:href="@{/tickets}">My tickets</a>
          <a th:href="@{/account}">Account</a>
          <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit">Sign out</button>
          </form>
        </nav>
      </div>
    </header>

    <main>
      <div class="toolbar">
        <div>
          <h1>My tickets</h1>
          <p class="lead">Requests submitted by <span th:text="${username}"></span>.</p>
        </div>
        <a class="button" th:href="@{/tickets/new}">New ticket</a>
      </div>

      <section aria-label="Ticket list">
        <div class="panel" th:if="${#lists.isEmpty(tickets)}">
          <h2>No tickets yet</h2>
          <p>Your support requests will appear here.</p>
        </div>
        <ul class="ticket-list" th:unless="${#lists.isEmpty(tickets)}">
          <li th:each="ticket : ${tickets}">
            <a th:href="@{/tickets/{id}(id=${ticket.id})}" th:text="${ticket.subject}"></a>
            <div class="meta">
              <span th:text="${ticket.category}"></span> ·
              <time th:text="${#temporals.format(ticket.createdAt, 'yyyy-MM-dd HH:mm')}"></time>
            </div>
          </li>
        </ul>
      </section>
    </main>
    <footer th:replace="~{fragments/footer :: notice}"></footer>
  </body>
</html>
