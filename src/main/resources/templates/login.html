<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · Secu Q&amp;A</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
  </head>
  <body>
    <header>
      <div class="bar">
        <a class="brand" th:href="@{/login}">Secu Q&amp;A</a>
      </div>
    </header>

    <main>
      <section class="panel form-panel">
        <h1>Sign in</h1>
        <p class="lead">Access your support tickets.</p>
        <p class="alert" th:if="${param.error}">Invalid credentials or account already signed in.</p>
        <p class="success" th:if="${param.registered}">Account created. Please sign in.</p>
        <p class="success" th:if="${param.logout}">You have signed out. Your account and tickets were removed.</p>

        <form th:action="@{/login}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <div class="field">
            <label for="username">Username</label>
            <input id="username" name="username" autocomplete="username" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <button class="button" type="submit">Sign in</button>
        </form>

        <p class="form-footer">New here? <a th:href="@{/register}">Create an account</a></p>
      </section>
    </main>
    <footer th:replace="~{fragments/footer :: notice}"></footer>
  </body>
</html>
